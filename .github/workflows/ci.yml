# CI for inquiryon-amp-core (OSS-001 hygiene gate + OSS-002/003 test gates).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: pytest -q
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release hygiene checks (secrets, forbidden files, markers, Enterprise imports)
        run: bash scripts/check_release_hygiene.sh .
